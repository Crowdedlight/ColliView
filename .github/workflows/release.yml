name: Release

on:
  push:
    tags: ['v*']
  # Manual runs build and upload the archives as workflow artifacts, without a release.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # Oldest available Ubuntu, so the binary runs on older glibc.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Optional: enables mozjpeg's SIMD (faster MJPEG decoding) on x86_64.
      - name: Install NASM
        if: startsWith(matrix.target, 'x86_64')
        uses: ilammy/setup-nasm@v1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libclang-dev libxkbcommon-dev libwayland-dev

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Package here, not in the release job: artifacts lose the executable bit.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "colliview-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/colliview.exe", README.md -DestinationPath "dist/$name.zip"

      - name: Package (Linux)
        if: runner.os != 'Windows'
        run: |
          name="colliview-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/colliview" README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"

      - uses: actions/upload-artifact@v7
        with:
          name: colliview-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: colliview-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      # Creates the release, or attaches to one already made in the GitHub UI.
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --title "ColliView $TAG" --generate-notes
          gh release upload "$TAG" dist/* --clobber
