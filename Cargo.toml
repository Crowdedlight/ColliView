[package]
name = "colliview"
version = "0.1.0"
edition = "2024"
description = "Live USB-camera collimation aid for Newtonian telescopes"
license = "MIT OR Apache-2.0"

[dependencies]
eframe = { version = "0.36", features = ["persistence"] }
egui = { version = "0.36", features = ["serde"] }
nokhwa = { version = "0.10.11", features = ["input-native"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_Media_DirectShow",
    "Win32_System_Com",
] }

[target.'cfg(target_os = "linux")'.dependencies]
v4l = "0.14"

[profile.dev]
# Keep debug builds responsive: detection and the test pattern are pixel loops.
opt-level = 1

[profile.dev.package."*"]
# Image decoding and processing are painfully slow unoptimized.
opt-level = 2
